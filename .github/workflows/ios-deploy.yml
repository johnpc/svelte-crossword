name: iOS Deploy

# Shared deploy: johnpc/ci-workflows (launch smoke, CI-keychain signing, per-job
# $RUNNER_TEMP paths, version bump through an auto-merging PR). Per-repo knobs only.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: johnpc/ci-workflows/.github/workflows/ios-deploy-capacitor.yml@v1
    secrets: inherit
    with:
      bundle-id: com.johncorser.crosswords
      archive-name: SmallCrosswords
      ref: main
      # Amplify Gen2 deps drag in conflicting zod peers; legacy-peer-deps is the
      # only way npm ci resolves them.
      npm-ci-args: --legacy-peer-deps
      amplify-outputs-path: src/amplify_outputs.json
      build-command: CAPACITOR_BUILD=1 npm run build
      bump: patch
