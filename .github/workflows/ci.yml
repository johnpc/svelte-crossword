name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      # Amplify Gen2 deps drag in conflicting zod peers; legacy-peer-deps
      # is the only way npm ci will resolve them without erroring.
      - run: npm ci --legacy-peer-deps

      # CI never talks to the real backend. The build embeds the e2e fixture
      # config and the Playwright suite answers every Cognito/Lambda call from
      # the in-process fake backend (e2e/fake-backend). No secrets needed.
      - name: Use the fake-backend amplify_outputs.json
        run: cp e2e/fixtures/amplify_outputs.e2e.json src/amplify_outputs.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Lint, type check, unit tests + coverage, CRAP, file length,
      # state-machine catalogue, build, e2e — the same script developers run.
      - name: Quality gates
        run: ./scripts/quality.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
